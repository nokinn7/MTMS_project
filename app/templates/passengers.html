<!DOCTYPE html>
<html>
<head>
    <title>MTMS - Passengers</title>
</head>
<body>
    <h1>MTMS Passenger List</h1>
    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Gender</th>
            <th>City</th>
        </tr>
        {% for passenger in passengers %}
        <tr>
            <td>{{ passenger.passengerId }}</td>
            <td>
                {{ passenger.firstName }}
                {{ passenger.lastName }}
            </td>
            <td>{{ passenger.gender }}</td>
            <td>{{ passenger.city }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
